name: Smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Engine starts
        run: python -X utf8 -m gdcheck --help
      - name: Launcher and installer script compile
        run: python -m py_compile lokal/gd_tools.py installer/build_installer.py
